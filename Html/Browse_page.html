<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Adoptly - Browse Pets</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Global CSS & Browse Page Specific CSS -->
<link rel="stylesheet" href="../Css/index.css">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: { DEFAULT: '#D96552', hover: '#c55644', light: '#FAECE9', dark: '#27292D', muted: '#7A7D84' },
        page: '#FAF5F3'
      },
      fontFamily: { sans: ['Poppins', 'sans-serif'] }
    }
  }
}
</script>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-rose-100 selection:text-brand">

<!-- NavigationBar -->
<div id="navbar-placeholder"></div>

<main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
  <nav class="text-xs text-gray-500 mb-6 flex items-center gap-2">
    <a class="hover:underline text-gray-600 font-medium" href="index.html">Home</a>
    <i class="fa-solid fa-chevron-right text-[10px] text-gray-400"></i>
    <span class="text-brand font-medium">Browse Pets</span>
  </nav>

  <section class="mb-8">
    <h1 class="text-3xl sm:text-4xl font-bold text-[#2A2B2E] tracking-tight">Find Your Perfect Companion</h1>
    <p class="mt-2 text-gray-500 text-sm sm:text-base">Browse adoptable pets from trusted shelters and rescue organizations.</p>
  </section>

  <div class="flex flex-col lg:flex-row items-start gap-8">
    <!-- Filter Sidebar -->
    <aside class="w-full lg:w-[310px] flex-shrink-0 lg:sticky lg:top-4 lg:max-h-[calc(100vh-2rem)] lg:overflow-y-auto">
      <div class="bg-white rounded-3xl p-6 shadow-sm border border-[#F3EBE7]">
        <div class="mb-5">
          <h2 class="text-xl font-bold text-brand tracking-tight">Filter Results</h2>
          <p class="text-xs text-gray-500 mt-0.5 font-normal">Find your perfect match</p>
        </div>

        <form class="space-y-4" onsubmit="event.preventDefault();">
          <!-- Pet Type -->
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1.5">Pet Type</label>
            <select id="filterType" class="custom-select w-full rounded-2xl border-gray-200 text-xs py-3 px-4 focus:ring-1 focus:ring-brand focus:border-brand bg-white text-gray-700 shadow-sm">
              <option value="All" selected>All Animals</option>
              <option value="Dog">Dogs</option>
              <option value="Cat">Cats</option>
              <option value="Rabbit">Rabbits</option>
              <option value="Bird">Birds</option>
            </select>
          </div>

          <!-- Breed -->
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1.5">Breed</label>
            <select id="filterBreed" class="custom-select w-full rounded-2xl border-gray-200 text-xs py-3 px-4 focus:ring-1 focus:ring-brand focus:border-brand bg-white text-gray-700 shadow-sm">
              <option value="All" selected>Any Breed</option>
            </select>
          </div>

          <!-- Location -->
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1.5">Location</label>
            <input id="filterLocation" class="w-full rounded-2xl border-gray-200 text-xs py-3 px-4 focus:ring-1 focus:ring-brand focus:border-brand placeholder-gray-400 shadow-sm" placeholder="Enter City" type="text">
          </div>

          <!-- Expandable Filters -->
          <div class="pt-2 space-y-3">
            <!-- Age -->
            <div class="filter-group">
              <div class="filter-header flex items-center justify-between border border-gray-200 rounded-2xl px-4 py-3 cursor-pointer hover:border-brand transition-colors bg-white">
                <div class="flex items-center gap-3">
                  <i class="fa-solid fa-cake-candles text-brand text-sm w-4"></i>
                  <span class="text-xs font-medium text-gray-700">Age</span>
                </div>
                <i class="fa-solid fa-chevron-down text-brand text-xs chevron"></i>
              </div>
              <div class="filter-content hidden mt-2 pl-2 space-y-2 text-xs text-gray-600">
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="ageFilter" class="age-filter rounded-full text-brand" value="baby"> Baby</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="ageFilter" class="age-filter rounded-full text-brand" value="kitten"> Kitten</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="ageFilter" class="age-filter rounded-full text-brand" value="puppy"> Puppy</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="ageFilter" class="age-filter rounded-full text-brand" value="young"> Young</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="ageFilter" class="age-filter rounded-full text-brand" value="adult"> Adult</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="ageFilter" class="age-filter rounded-full text-brand" value="senior"> Senior</label>
              </div>
            </div>

            <!-- Size -->
            <div class="filter-group">
              <div class="filter-header flex items-center justify-between border border-gray-200 rounded-2xl px-4 py-3 cursor-pointer hover:border-brand transition-colors bg-white">
                <div class="flex items-center gap-3">
                  <i class="fa-solid fa-ruler-combined text-brand text-sm w-4"></i>
                  <span class="text-xs font-medium text-gray-700">Size</span>
                </div>
                <i class="fa-solid fa-chevron-down text-brand text-xs chevron"></i>
              </div>
              <div class="filter-content hidden mt-2 pl-2 space-y-2 text-xs text-gray-600">
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="sizeFilter" class="size-filter rounded-full text-brand" value="small"> Small</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="sizeFilter" class="size-filter rounded-full text-brand" value="medium"> Medium</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="sizeFilter" class="size-filter rounded-full text-brand" value="large"> Large</label>
              </div>
            </div>

            <!-- Gender -->
            <div class="filter-group">
              <div class="filter-header flex items-center justify-between border border-gray-200 rounded-2xl px-4 py-3 cursor-pointer hover:border-brand transition-colors bg-white">
                <div class="flex items-center gap-3">
                  <i class="fa-solid fa-venus text-brand text-sm w-4"></i>
                  <span class="text-xs font-medium text-gray-700">Gender</span>
                </div>
                <i class="fa-solid fa-chevron-down text-brand text-xs chevron"></i>
              </div>
              <div class="filter-content hidden mt-2 pl-2 space-y-2 text-xs text-gray-600">
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="genderFilter" class="gender-filter rounded-full text-brand" value="male"> Male</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="genderFilter" class="gender-filter rounded-full text-brand" value="female"> Female</label>
              </div>
            </div>

            <!-- Color -->
            <div class="filter-group">
              <div class="filter-header flex items-center justify-between border border-gray-200 rounded-2xl px-4 py-3 cursor-pointer hover:border-brand transition-colors bg-white">
                <div class="flex items-center gap-3">
                  <i class="fa-solid fa-palette text-brand text-sm w-4"></i>
                  <span class="text-xs font-medium text-gray-700">Color</span>
                </div>
                <i class="fa-solid fa-chevron-down text-brand text-xs chevron"></i>
              </div>
              <div class="filter-content hidden mt-2 pl-2 space-y-2 text-xs text-gray-600">
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="colorFilter" class="color-filter rounded-full text-brand" value="black"> Black</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="colorFilter" class="color-filter rounded-full text-brand" value="white"> White</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="colorFilter" class="color-filter rounded-full text-brand" value="brown"> Brown</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="colorFilter" class="color-filter rounded-full text-brand" value="mixed"> Mixed</label>
              </div>
            </div>

            <!-- Good With -->
            <div class="filter-group">
              <div class="filter-header flex items-center justify-between border border-gray-200 rounded-2xl px-4 py-3 cursor-pointer hover:border-brand transition-colors bg-white">
                <div class="flex items-center gap-3">
                  <i class="fa-solid fa-tags text-brand text-sm w-4"></i>
                  <span class="text-xs font-medium text-gray-700">Good With</span>
                </div>
                <i class="fa-solid fa-chevron-down text-brand text-xs chevron"></i>
              </div>
              <div class="filter-content hidden mt-2 pl-2 space-y-2 text-xs text-gray-600">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="goodWithFilter" class="goodwith-filter rounded-full text-brand" value="all" checked> All
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="goodWithFilter" class="goodwith-filter rounded-full text-brand" value="dog"> Dogs
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="goodWithFilter" class="goodwith-filter rounded-full text-brand" value="cat"> Cats
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="goodWithFilter" class="goodwith-filter rounded-full text-brand" value="bird"> Birds
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="goodWithFilter" class="goodwith-filter rounded-full text-brand" value="rabbit"> Rabbits
                </label>
              </div>
            </div>
          </div>
        </form>
      </div>
    </aside>

    <!-- Listing Section -->
    <section class="flex-1 w-full">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
        <div class="flex items-center w-full sm:max-w-md gap-2">
          <div class="relative flex-1">
            <input id="petSearchInput" class="w-full rounded-2xl border-gray-200 bg-white text-xs py-3 px-4 focus:ring-1 focus:ring-brand focus:border-brand placeholder-gray-400 shadow-sm" placeholder="Search by name or keyword..." type="text">
          </div>
          <button aria-label="Search" class="bg-brand text-white w-10 h-10 rounded-xl flex items-center justify-center hover:bg-brand-hover transition-colors flex-shrink-0 shadow-sm">
            <i class="fa-solid fa-magnifying-glass text-sm"></i>
          </button>
        </div>

        <!-- Sorted by -->
        <div class="relative self-end sm:self-center">
          <div id="sortHeader" class="flex items-center gap-2 cursor-pointer text-xs font-medium text-gray-600 hover:text-brand transition-colors">
            <span>Sorted by</span>
            <i id="sortChevron" class="fa-solid fa-chevron-down text-brand text-[10px] transition-transform"></i>
          </div>
          <div id="sortDropdown" class="hidden absolute right-0 mt-2 w-44 bg-white border border-gray-200 rounded-xl shadow-lg py-2 z-20 text-xs">
            <button class="sort-option w-full text-left px-4 py-2 hover:bg-brand-light hover:text-brand transition-colors" data-sort="newest">Newest</button>
            <button class="sort-option w-full text-left px-4 py-2 hover:bg-brand-light hover:text-brand transition-colors" data-sort="oldest">Oldest</button>
            <button class="sort-option w-full text-left px-4 py-2 hover:bg-brand-light hover:text-brand transition-colors" data-sort="name-asc">Name A-Z</button>
            <button class="sort-option w-full text-left px-4 py-2 hover:bg-brand-light hover:text-brand transition-colors" data-sort="name-desc">Name Z-A</button>
          </div>
        </div>
      </div>

      <div id="noResultsMsg" class="hidden py-12 text-center text-gray-500 text-sm" role="status" aria-live="polite">
        No available pets.
      </div>
      <div id="petsLoadError" class="hidden py-12 text-center text-red-600 text-sm" role="alert">
        Pets could not be loaded. Please try again later.
      </div>

      <!-- Dynamically Populated Pet Cards Container -->
      <div id="petsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>

      <div class="mt-12 flex items-center justify-center gap-2 text-sm font-medium text-gray-600 flex-wrap">
        <button aria-label="Previous Page" class="w-9 h-9 flex items-center justify-center rounded-full border border-gray-200 bg-white hover:border-brand hover:text-brand transition-colors">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div id="pageNumbers" class="flex items-center justify-center gap-2 flex-wrap"></div>
        <button aria-label="Next Page" class="w-9 h-9 flex items-center justify-center rounded-full border border-gray-200 bg-white hover:border-brand hover:text-brand transition-colors">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>
    </section>
  </div>
</main>

<!-- FOOTER -->
<div id="footer-placeholder"></div>
<script src="../Js/Components.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const searchInput = document.getElementById('petSearchInput');
  const filterType = document.getElementById('filterType');
  const filterBreed = document.getElementById('filterBreed');
  const filterLocation = document.getElementById('filterLocation');
  const petsGrid = document.getElementById('petsGrid');
  let petCards = [];
  let originalOrder = [];
  let currentPage = 1;
  const itemsPerPage = 9;

  // Fetch pet dataset directly from PHP backend API
  fetch('../php/Browse_page.php?action=get_pets')
    .then(res => {
      if (!res.ok) throw new Error(`Pet request failed with status ${res.status}`);
      return res.json();
    })
    .then(data => {
      if (!data || !Array.isArray(data.pets) || !Array.isArray(data.availableImages)) {
        throw new Error('Pet service returned an invalid response.');
      }
      buildPetCards(data.pets);
      initPageLogic();
    })
    .catch(err => {
      console.error('Failed to load pet data:', err);
      document.getElementById('petsLoadError').classList.remove('hidden');
    });

  function buildPetCards(pets) {
    petsGrid.replaceChildren();
    pets.forEach(pet => {
      const gIcon = pet.gender === 'Female' ? 'fa-venus' : 'fa-mars';
      const article = document.createElement('article');
      article.className = 'pet-card bg-white rounded-3xl overflow-hidden shadow-sm border border-[#F3EBE7] flex flex-col';
      article.setAttribute('data-type', pet.type);
      article.setAttribute('data-image-path', pet.img);
      article.setAttribute('data-generated', 'true');

      article.innerHTML = `
        <div class="relative h-56 w-full overflow-hidden">
          ${pet.img ? `<img src="${pet.img}" alt="${pet.name}" class="w-full h-full object-cover">` : ''}
          <div class="w-full h-full bg-[#f3f4f6] flex items-center justify-center text-gray-300"><i class="fa-solid fa-paw text-5xl opacity-40"></i></div>
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
          <h3 class="absolute bottom-3 left-4 text-xl font-bold text-white tracking-wide">${pet.name}</h3>
          <button aria-label="Favorite ${pet.name}" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/80 backdrop-blur-sm flex items-center justify-center text-brand hover:bg-white transition-all shadow-sm">
            <i class="fa-regular fa-heart text-sm"></i>
          </button>
        </div>
        <div class="p-4 flex-1 flex flex-col justify-between text-xs text-gray-600 space-y-3">
          <div class="space-y-2 border-b border-gray-100 pb-3">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-location-dot text-brand w-3.5"></i>
              <span class="location-text">${pet.location}</span>
            </div>
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-paw text-brand w-3.5"></i>
              <span class="breed-text">${pet.breed}</span>
            </div>
            <div class="flex items-center gap-4">
              <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-cake-candles text-brand w-3.5"></i>
                <span>${pet.age}</span>
              </div>
              <div class="flex items-center gap-1.5">
                <i class="fa-solid ${gIcon} text-brand w-3.5"></i>
                <span>${pet.gender}</span>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2 pt-1">
            <a href="../Pet_details.php" class="flex-1 bg-brand text-white font-medium py-2 px-3 rounded-full hover:bg-brand-hover transition-colors shadow-sm text-center">Adopt Me</a>
            <a href="../Pet_details.php" class="flex items-center justify-center gap-1.5 px-3 py-2 text-brand font-medium hover:bg-brand-light rounded-full transition-colors">
              <i class="fa-solid fa-info-circle text-xs"></i>
              <span>More About Me</span>
            </a>
          </div>
        </div>
      `;
      petsGrid.appendChild(article);
    });
  }

  function initPageLogic() {
    petCards = Array.from(petsGrid.querySelectorAll('.pet-card'));
    originalOrder = [...petCards];

    const petIcons = { Dog: 'fa-dog', Cat: 'fa-cat', Bird: 'fa-dove' };

    function speciesIconMarkup(type, classes) {
      if (type === 'Rabbit') {
        return `<svg class="${classes}" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true" style="width:1em;height:1em">
          <ellipse cx="23" cy="16" rx="6" ry="17" transform="rotate(-12 23 16)"></ellipse>
          <ellipse cx="39" cy="15" rx="6" ry="18" transform="rotate(9 39 15)"></ellipse>
          <ellipse cx="33" cy="41" rx="19" ry="15"></ellipse>
          <circle cx="50" cy="34" r="10"></circle>
          <circle cx="56" cy="26" r="2" fill="#FAF5F3"></circle>
          <circle cx="15" cy="39" r="6"></circle>
          <ellipse cx="41" cy="52" rx="9" ry="5"></ellipse>
        </svg>`;
      }
      return `<i class="fa-solid ${petIcons[type] || 'fa-paw'} ${classes}" aria-hidden="true"></i>`;
    }

    petCards.forEach(card => {
      const type = card.dataset.type;
      const breedLabel = card.querySelector('.breed-text');
      const breedIcon = breedLabel?.previousElementSibling;
      if (breedIcon) {
        breedIcon.outerHTML = speciesIconMarkup(type, 'text-brand w-3.5');
      }

      const image = card.querySelector('img');
      const fallback = card.querySelector('.relative.h-56 div');
      if (image && fallback) {
        image.addEventListener('load', () => {
          image.classList.remove('hidden');
          fallback.classList.add('hidden');
        });
        image.addEventListener('error', () => {
          image.classList.add('hidden');
          fallback.classList.remove('hidden');
        });
      }
    });

    updateBreedOptions();
    petCards.forEach(card => card.dataset.visible = 'true');
    showPage(1);
  }

  function updateBreedOptions() {
    if (!filterBreed) return;
    const selectedType = filterType ? filterType.value.toLowerCase() : 'all';
    const breeds = [...new Set(petCards
      .filter(card => selectedType === 'all' || (card.getAttribute('data-type') || '').toLowerCase() === selectedType)
      .map(card => card.querySelector('.breed-text')?.textContent.trim())
      .filter(Boolean))]
      .sort((a, b) => a.localeCompare(b));

    const previousBreed = filterBreed.value;
    filterBreed.replaceChildren(new Option('Any Breed', 'All'));
    breeds.forEach(breed => filterBreed.add(new Option(breed, breed)));
    filterBreed.value = breeds.includes(previousBreed) ? previousBreed : 'All';
  }

  function filterPets() {
    const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
    const selectedType = filterType ? filterType.value.toLowerCase() : 'all';
    const selectedBreed = filterBreed ? filterBreed.value.toLowerCase() : 'all';
    const locationQuery = filterLocation ? filterLocation.value.toLowerCase().trim() : '';

    petCards.forEach(card => {
      const fullText = card.textContent.toLowerCase();
      const petType = (card.getAttribute('data-type') || '').toLowerCase();
      const petBreed = (card.querySelector('.breed-text')?.textContent || '').toLowerCase();
      const petLocation = (card.querySelector('.location-text')?.textContent || '').toLowerCase();

      const matchesSearch = !query || fullText.includes(query);
      const matchesType = selectedType === 'all' || petType === selectedType;
      const matchesBreed = selectedBreed === 'all' || petBreed === selectedBreed;
      const matchesLocation = !locationQuery || petLocation.includes(locationQuery);

      const isVisible = matchesSearch && matchesType && matchesBreed && matchesLocation;
      card.dataset.visible = isVisible ? 'true' : 'false';
    });

    currentPage = 1;
    showPage(currentPage);
  }

  if (searchInput) searchInput.addEventListener('input', filterPets);
  if (filterType) {
    filterType.addEventListener('change', () => {
      updateBreedOptions();
      filterPets();
    });
  }
  if (filterBreed) filterBreed.addEventListener('change', filterPets);
  if (filterLocation) filterLocation.addEventListener('input', filterPets);

  document.querySelectorAll('.filter-header').forEach(header => {
    header.addEventListener('click', () => {
      const content = header.nextElementSibling;
      const chevron = header.querySelector('.chevron');
      content.classList.toggle('hidden');
      chevron.classList.toggle('rotate-180');
    });
  });

  const sortHeader = document.getElementById('sortHeader');
  const sortDropdown = document.getElementById('sortDropdown');
  const sortChevron = document.getElementById('sortChevron');

  function sortPets(type) {
    let sorted = [...petCards];
    if (type === 'newest') sorted = [...originalOrder];
    else if (type === 'oldest') sorted = [...originalOrder].reverse();
    else if (type === 'name-asc') {
      sorted.sort((a, b) => a.querySelector('h3').textContent.trim().localeCompare(b.querySelector('h3').textContent.trim()));
    } else if (type === 'name-desc') {
      sorted.sort((a, b) => b.querySelector('h3').textContent.trim().localeCompare(a.querySelector('h3').textContent.trim()));
    }

    sorted.forEach(card => petsGrid.appendChild(card));
    currentPage = 1;
    showPage(currentPage);
  }

  if (sortHeader) {
    sortHeader.addEventListener('click', (e) => {
      e.stopPropagation();
      sortDropdown.classList.toggle('hidden');
      sortChevron.classList.toggle('rotate-180');
    });
  }

  document.addEventListener('click', () => {
    if (sortDropdown && !sortDropdown.classList.contains('hidden')) {
      sortDropdown.classList.add('hidden');
      sortChevron.classList.remove('rotate-180');
    }
  });

  document.querySelectorAll('.sort-option').forEach(option => {
    option.addEventListener('click', () => {
      const sortType = option.getAttribute('data-sort');
      sortHeader.querySelector('span').textContent = `Sorted by: ${option.textContent}`;
      sortPets(sortType);
      sortDropdown.classList.add('hidden');
      sortChevron.classList.remove('rotate-180');
    });
  });

  function showPage(page) {
    const pageNumbers = document.getElementById('pageNumbers');
    const noResultsMsg = document.getElementById('noResultsMsg');
    const prevBtn = document.querySelector('[aria-label="Previous Page"]');
    const nextBtn = document.querySelector('[aria-label="Next Page"]');

    const visibleCards = petCards.filter(card => card.dataset.visible !== 'false');
    const totalPages = Math.ceil(visibleCards.length / itemsPerPage) || 1;
    currentPage = Math.min(Math.max(page, 1), totalPages);

    pageNumbers.replaceChildren();
    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = i === currentPage
        ? 'page-btn w-9 h-9 flex items-center justify-center rounded-full bg-brand text-white shadow-sm font-semibold'
        : 'page-btn w-9 h-9 flex items-center justify-center rounded-full border border-gray-200 bg-white hover:border-brand hover:text-brand transition-colors';
      btn.textContent = i;
      btn.addEventListener('click', () => showPage(i));
      pageNumbers.appendChild(btn);
    }

    petCards.forEach(card => card.classList.add('hidden'));
    const start = (currentPage - 1) * itemsPerPage;
    visibleCards.slice(start, start + itemsPerPage).forEach(card => card.classList.remove('hidden'));

    if (noResultsMsg) noResultsMsg.classList.toggle('hidden', visibleCards.length > 0);
    if (prevBtn) prevBtn.disabled = currentPage === 1;
    if (nextBtn) nextBtn.disabled = currentPage === totalPages;
  }

  document.querySelector('[aria-label="Previous Page"]')?.addEventListener('click', () => {
    if (currentPage > 1) showPage(currentPage - 1);
  });

  document.querySelector('[aria-label="Next Page"]')?.addEventListener('click', () => {
    const visibleCards = petCards.filter(card => card.dataset.visible !== 'false');
    const totalPages = Math.ceil(visibleCards.length / itemsPerPage) || 1;
    if (currentPage < totalPages) showPage(currentPage + 1);
  });
});

document.addEventListener('click', event => {
  if (!(event.target instanceof Element)) return;
  const button = event.target.closest('.pet-card button[aria-label^="Favorite"]');
  if (!button) return;

  event.preventDefault();
  event.stopPropagation();
  const icon = button.querySelector('i');
  const isFavorite = icon.classList.toggle('fa-solid');
  icon.classList.toggle('fa-regular', !isFavorite);
  icon.style.color = isFavorite ? '#D96552' : '';
});
</script>
</body>
